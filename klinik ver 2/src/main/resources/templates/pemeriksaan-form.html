<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Pemeriksaan - Sistem Klinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Panggilan Fragment Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('pemeriksaan')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 px-4 content pt-4">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                <h2 class="text-dark"><i class="fa-solid fa-file-medical text-primary"></i> Form Rekam Medis Pasien</h2>
                <a th:href="@{/pemeriksaan}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Kembali</a>
            </div>

            <div class="row">
                <!-- Info Pasien & Kunjungan -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-dark text-white fw-bold">
                            <i class="fa-solid fa-user-injured me-1"></i> Informasi Pasien
                        </div>
                        <div class="card-body">
                            <p class="mb-1"><strong>Nama Pasien:</strong> <span th:text="${kunjungan.pasien != null ? kunjungan.pasien.nama : '-'}"></span></p>
                            <p class="mb-1"><strong>Dokter Pemeriksa:</strong> <span th:text="${kunjungan.dokter != null ? kunjungan.dokter.nama : '-'}"></span></p>
                            <p class="mb-1"><strong>Tanggal Kunjungan:</strong> <span th:text="${kunjungan.tanggalKunjungan}"></span></p>
                            <hr />
                            <p class="mb-0"><strong>Keluhan Awal:</strong></p>
                            <p class="text-muted fst-italic" th:text="${kunjungan.keluhan}"></p>
                        </div>
                    </div>
                </div>

                <!-- Form Catatan Rekam Medis -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white fw-bold">
                            Input Diagnosa & Resep
                        </div>
                        <div class="card-body">
                            <form th:action="@{/pemeriksaan/simpan}" th:object="${rekamMedis}" method="post">
                                <input type="hidden" th:field="*{kunjungan.id}" />

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">DIAGNOSA</label>
                                    <textarea class="form-control" th:field="*{diagnosa}" rows="3" placeholder="Tulis diagnosa dokter..." required="required"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">TINDAKAN MEDIS</label>
                                    <textarea class="form-control" th:field="*{tindakan}" rows="2" placeholder="Tindakan yang diberikan..."></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">RESEP OBAT</label>
                                    <textarea class="form-control" th:field="*{resepObat}" rows="3" placeholder="Nama obat, dosis, dan aturan pakai..."></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/pemeriksaan}" class="btn btn-secondary btn-sm">Batal</a>
                                    <button type="submit" class="btn btn-success btn-sm">
                                        <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Rekam Medis & Selesaikan
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
