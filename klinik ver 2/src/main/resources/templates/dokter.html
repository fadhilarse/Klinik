<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Dokter - Sistem Klinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Panggilan Fragment Sidebar (Passing parameter 'dokter') -->
        <div th:replace="~{fragments/sidebar :: sidebar('dokter')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 px-4 content pt-4">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                <h2 class="text-dark"><i class="fa-solid fa-user-md text-primary"></i> Manajemen Data Dokter</h2>
            </div>

            <!-- Banner Notifikasi Success / Error -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <!-- Form Area -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white fw-bold">
                            <span th:text="${dokter != null && dokter.id != null ? 'Edit Data Dokter' : 'Tambah Dokter Baru'}"></span>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/dokter/simpan}" th:object="${dokter}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}">
                                
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">NAMA LENGKAP</label>
                                    <input type="text" 
                                           class="form-control form-control-sm" 
                                           th:field="*{nama}" 
                                           th:classappend="${#fields.hasErrors('nama')} ? 'is-invalid'" 
                                           placeholder="Contoh: dr. Budi Santoso">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nama')}" th:errors="*{nama}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">ALAMAT</label>
                                    <textarea class="form-control form-control-sm" 
                                              th:field="*{alamat}" 
                                              rows="2" 
                                              th:classappend="${#fields.hasErrors('alamat')} ? 'is-invalid'" 
                                              placeholder="Alamat domisili"></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('alamat')}" th:errors="*{alamat}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">SPESIALISASI</label>
                                    <input type="text" 
                                           class="form-control form-control-sm" 
                                           th:field="*{spesialisasi}" 
                                           th:classappend="${#fields.hasErrors('spesialisasi')} ? 'is-invalid'" 
                                           placeholder="Contoh: Penyakit Dalam">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('spesialisasi')}" th:errors="*{spesialisasi}"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">NO. IZIN PRAKTEK (SIP)</label>
                                    <input type="text" 
                                           class="form-control form-control-sm" 
                                           th:field="*{nomorIzinPraktek}" 
                                           th:classappend="${#fields.hasErrors('nomorIzinPraktek')} ? 'is-invalid'" 
                                           placeholder="Nomor registrasi medis">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nomorIzinPraktek')}" th:errors="*{nomorIzinPraktek}"></div>
                                </div>
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-sm"><i class="fa-solid fa-floppy-disk me-1"></i> Simpan Data</button>
                                    <a th:if="${dokter != null && dokter.id != null}" th:href="@{/dokter}" class="btn btn-outline-secondary btn-sm">Batal Edit</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Table Area -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-dark">
                                        <tr>
                                            <th class="ps-3">Nama Dokter</th>
                                            <th>Spesialis & SIP</th>
                                            <th>Alamat</th>
                                            <th class="text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="d : ${listDokter}">
                                            <td class="ps-3 fw-bold text-primary" th:text="${d.nama}"></td>
                                            <td>
                                                <span th:text="${d.spesialisasi}"></span><br>
                                                <small class="text-muted" th:text="'SIP: ' + ${d.nomorIzinPraktek}"></small>
                                            </td>
                                            <td th:text="${d.alamat}"></td>
                                            <td class="text-center">
                                                <a th:href="@{/dokter/edit/{id}(id=${d.id})}" class="btn btn-sm btn-warning text-dark"><i class="fa-solid fa-pen-to-square"></i></a>
                                                <a th:href="@{/dokter/hapus/{id}(id=${d.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Yakin hapus data dokter ini?')"><i class="fa-solid fa-trash"></i></a>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(listDokter)}">
                                            <td colspan="4" class="text-center text-muted p-5">
                                                <i class="fa-solid fa-folder-open fa-2x mb-2"></i><br> Belum ada data dokter yang terdaftar.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
