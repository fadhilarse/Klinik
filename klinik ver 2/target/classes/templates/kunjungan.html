<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kunjungan / Antrean</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome untuk ikon di sidebar dan judul -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- MEMANGGIL FRAGMENT SIDEBAR -->
        <div th:replace="~{fragments/sidebar :: sidebar('kunjungan')}"></div>

        <!-- KONTEN UTAMA HALAMAN -->
        <main class="col-md-10 px-4 content pt-4">
            
            <h2 class="mb-4"><i class="fa-solid fa-clipboard-list text-primary"></i> Kelola Kunjungan / Antrean</h2>

            <!-- Pesan Sukses -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- 1. FORM PENDAFTARAN ANTREAN -->
            <div class="card mb-4 shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0" th:text="${kunjungan.id != null ? 'Edit Antrean' : 'Tambah Antrean Baru'}"></h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/kunjungan/simpan}" th:object="${kunjungan}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{tanggalKunjungan}">
                        <input type="hidden" th:field="*{status}">

                        <div class="row">
                            <!-- Pilih Pasien -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Pilih Pasien</label>
                                <select class="form-select" th:field="*{pasien}" required>
                                    <option value="" disabled selected>-- Pilih Pasien --</option>
                                    <option th:each="p : ${listPasien}" th:value="${p.id}" th:text="${p.nama}"></option>
                                </select>
                            </div>

                            <!-- Pilih Dokter -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Pilih Dokter</label>
                                <select class="form-select" th:field="*{dokter}" required>
                                    <option value="" disabled selected>-- Pilih Dokter --</option>
                                    <option th:each="d : ${listDokter}" th:value="${d.id}" th:text="${d.nama + ' (' + d.spesialisasi + ')'}"></option>
                                </select>
                            </div>

                            <!-- Pilih Ruangan -->
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Pilih Ruangan</label>
                                <select class="form-select" th:field="*{ruangan}" required>
                                    <option value="" disabled selected>-- Pilih Ruangan --</option>
                                    <option th:each="r : ${listRuangan}" th:value="${r.id}" th:text="${r.nomorRuang}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- Input Keluhan -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Keluhan Awal</label>
                            <textarea class="form-control" th:field="*{keluhan}" rows="2" placeholder="Masukkan keluhan pasien..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-save me-1"></i> <span th:text="${kunjungan.id != null ? 'Update Antrean' : 'Daftarkan Antrean'}"></span>
                        </button>
                        <a th:if="${kunjungan.id != null}" th:href="@{/kunjungan}" class="btn btn-secondary">Batal Edit</a>
                    </form>
                </div>
            </div>

            <!-- 2. TABEL DAFTAR ANTREAN -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0"><i class="fa-solid fa-list me-2"></i> Daftar Antrean Hari Ini</h5>
                </div>
                <div class="card-body table-responsive p-0">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">No</th>
                                <th>Tanggal</th>
                                <th>Pasien</th>
                                <th>Dokter</th>
                                <th>Ruangan</th>
                                <th>Keluhan</th>
                                <th>Status</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="k, iterStat : ${listKunjungan}">
                                <td class="ps-3" th:text="${iterStat.count}"></td>
                                <td th:text="${k.tanggalKunjungan}"></td>
                                <td class="fw-bold text-primary" th:text="${k.pasien != null ? k.pasien.nama : '-'}"></td>
                                <td th:text="${k.dokter != null ? k.dokter.nama : '-'}"></td>
                                <td th:text="${k.ruangan != null ? k.ruangan.nomorRuang : '-'}"></td>
                                <td th:text="${k.keluhan}"></td>
                                <td>
                                    <span class="badge bg-warning text-dark" th:text="${k.status}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/kunjungan/edit/{id}(id=${k.id})}" class="btn btn-sm btn-warning" title="Edit"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <a th:href="@{/kunjungan/hapus/{id}(id=${k.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Apakah Anda yakin ingin menghapus antrean ini?');" title="Hapus"><i class="fa-solid fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listKunjungan)}">
                                <td colspan="8" class="text-center text-muted p-4">
                                    <i class="fa-solid fa-folder-open fa-2x mb-2"></i><br> Belum ada data antrean.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
