<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Medis - Klinik Care</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #343a40; }
        .sidebar a { color: #cfd8dc; text-decoration: none; padding: 15px 20px; display: block; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: #495057; color: #fff; border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Memanggil Sidebar (Parameter 'riwayat' agar menu Riwayat Medis menyala) -->
        <div th:replace="~{fragments/sidebar :: sidebar('riwayat')}"></div>

        <!-- Konten Utama -->
        <main class="col-md-10 ms-sm-auto px-md-4 pt-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom">
                <h1 class="h2"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i> Riwayat Rekam Medis</h1>
                
                <!-- Tombol Kembali (Bisa untuk kembali ke daftar antrean pemeriksaan) -->
                <a th:href="@{/pemeriksaan}" class="btn btn-outline-secondary btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Pemeriksaan
                </a>
            </div>

            <!-- TAMBAHAN: Alert Notifikasi Sukses/Gagal Hapus -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Tabel Riwayat Medis -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark text-center">
                                <tr>
                                    <th>Tanggal & Waktu</th>
                                    <th>Nama Pasien</th>
                                    <th>Dokter Pemeriksa</th>
                                    <th>Keluhan Awal</th>
                                    <th>Diagnosa</th>
                                    <th>Tindakan Medis</th>
                                    <th>Resep Obat</th>
                                    <!-- TAMBAHAN: Header Aksi -->
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Looping Data Riwayat -->
                                <tr th:each="riwayat : ${daftarRiwayat}">
                                    
                                    <!-- 1. Tanggal & Waktu (Cek waktuPemeriksaan, fallback ke tanggalKunjungan) -->
                                    <td class="text-center align-middle">
                                        <span th:if="${riwayat.waktuPemeriksaan != null}" 
                                              th:text="${#temporals.format(riwayat.waktuPemeriksaan, 'dd-MM-yyyy HH:mm')}"></span>
                                        <span th:if="${riwayat.waktuPemeriksaan == null and riwayat.kunjungan != null}" 
                                              th:text="${riwayat.kunjungan.tanggalKunjungan}"></span>
                                    </td>

                                    <!-- Data Pasien & Dokter (Diambil dari relasi Kunjungan) -->
                                    <td class="align-middle fw-bold text-primary" th:text="${riwayat.kunjungan != null and riwayat.kunjungan.pasien != null ? riwayat.kunjungan.pasien.nama : '-'}"></td>
                                    <td class="align-middle" th:text="${riwayat.kunjungan != null and riwayat.kunjungan.dokter != null ? riwayat.kunjungan.dokter.nama : '-'}"></td>

                                    <!-- 2. Keluhan Awal (Diambil dari tabel Kunjungan) -->
                                    <td class="align-middle" th:text="${riwayat.kunjungan != null ? riwayat.kunjungan.keluhan : '-'}"></td>

                                    <!-- 3. Diagnosa, Tindakan, dan Resep -->
                                    <td class="align-middle" th:text="${riwayat.diagnosa}"></td>
                                    <td class="align-middle" th:text="${riwayat.tindakan}"></td>
                                    <td class="align-middle" th:text="${riwayat.resepObat}"></td>
                                    
                                    <!-- TAMBAHAN: Tombol Hapus -->
                                    <td class="text-center align-middle">
                                        <a th:href="@{/pemeriksaan/riwayat/hapus/{id}(id=${riwayat.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('Apakah Anda yakin ingin menghapus data riwayat ini?')">
                                            <i class="fa-solid fa-trash"></i> Hapus
                                        </a>
                                    </td>
                                </tr>
                                
                                <!-- 4. Tampil jika data kosong -->
                                <tr th:if="${#lists.isEmpty(daftarRiwayat)}">
                                    <!-- UPDATE: colspan diubah dari 7 menjadi 8 karena ada tambahan kolom Aksi -->
                                    <td colspan="8" class="text-center text-muted fst-italic py-4">
                                        Belum ada data riwayat medis yang tersimpan.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
