<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Antrean - Sistem Klinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <!-- Panggilan Fragment Sidebar (Passing parameter 'kunjungan') -->
        <div th:replace="~{fragments/sidebar :: sidebar('kunjungan')}"></div>
        
        <main class="col-md-10 px-4 content pt-4">
            <h2><i class="fa-solid fa-clipboard-list text-primary"></i> Manajemen Antrean Pasien</h2>
            <div class="alert alert-info mt-3">
                <i class="fa-solid fa-info-circle me-2"></i> Halaman Antrean siap dikembangkan.
            </div>
        </main>
    </div>
</div>
</body>
</html>
