<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeriksaan Pasien - Sistem Klinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Panggilan Fragment Sidebar (Passing parameter 'pemeriksaan') -->
        <div th:replace="~{fragments/sidebar :: sidebar('pemeriksaan')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 px-4 content pt-4">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                <h2 class="text-dark"><i class="fa-solid fa-stethoscope text-primary"></i> Daftar Antrean Pemeriksaan Dokter</h2>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-3">Nama Pasien</th>
                                    <th>Dokter Penanggung Jawab</th>
                                    <th>Keluhan Pasien</th>
                                    <th>Tanggal Masuk</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="k : ${antreanDokter}">
                                    <td class="ps-3 fw-bold text-primary" th:text="${k.pasien != null ? k.pasien.nama : '-'}"></td>
                                    <td th:text="${k.dokter != null ? k.dokter.nama : '-'}"></td>
                                    <td th:text="${k.keluhan}"></td>
                                    <td th:text="${k.tanggalKunjungan}"></td>
                                    <td class="text-center">
                                        <a th:href="@{/pemeriksaan/proses/{id}(id=${k.id})}" class="btn btn-sm btn-primary">
                                            <i class="fa-solid fa-notes-medical me-1"></i> Periksa Pasien
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(antreanDokter)}">
                                    <td colspan="5" class="text-center text-muted p-5">
                                        <i class="fa-solid fa-circle-check fa-2x mb-2 text-success"></i><br> Tidak ada antrean pasien yang sedang menunggu saat ini.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
