<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pasien - Sistem Klinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Panggilan Fragment Sidebar (Passing parameter 'pasien') -->
        <div th:replace="~{fragments/sidebar :: sidebar('pasien')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 px-4 content pt-4">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                <h2 class="text-dark"><i class="fa-solid fa-users text-primary"></i> Manajemen Data Pasien</h2>
            </div>

            <!-- Banner Notifikasi -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <!-- Form Area (Tambah / Edit) -->
                <div class="col-md-4 mb-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-primary text-white fw-bold">
                            <span th:text="${pasien != null && pasien.id != null ? 'Edit Data Pasien' : 'Tambah Pasien Baru'}"></span>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/pasien/simpan}" th:object="${pasien}" method="post">
                                <!-- Hidden ID untuk update -->
                                <input type="hidden" th:field="*{id}">

                                <!-- Field Nama Pasien -->
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">NAMA LENGKAP</label>
                                    <input type="text" class="form-control form-control-sm" th:field="*{nama}" placeholder="Contoh: Ahmad Subagja" required>
                                </div>

                                <!-- Field Alamat -->
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">ALAMAT</label>
                                    <textarea class="form-control form-control-sm" th:field="*{alamat}" rows="3" placeholder="Alamat domisili pasien"></textarea>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-sm"><i class="fa-solid fa-floppy-disk me-1"></i> Simpan Data</button>
                                    <a th:if="${pasien != null && pasien.id != null}" th:href="@{/pasien}" class="btn btn-outline-secondary btn-sm">Batal Edit</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Table Area -->
                <div class="col-md-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-dark">
                                        <tr>
                                            <th class="ps-3">Nama Pasien</th>
                                            <th>Alamat</th>
                                            <th class="text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="p : ${listPasien}">
                                            <td class="ps-3 fw-bold text-primary" th:text="${p.nama}"></td>
                                            <td th:text="${p.alamat}"></td>
                                            <td class="text-center">
                                                <a th:href="@{/pasien/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning text-dark"><i class="fa-solid fa-pen-to-square"></i></a>
                                                <a th:href="@{/pasien/hapus/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Yakin hapus data pasien ini?')"><i class="fa-solid fa-trash"></i></a>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(listPasien)}">
                                            <td colspan="3" class="text-center text-muted p-5">
                                                <i class="fa-solid fa-folder-open fa-2x mb-2"></i><br> Belum ada data pasien yang terdaftar.
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
