<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistem Klinik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar .active { background-color: #34495e; border-left: 4px solid #3498db; }
        .content { background-color: #f4f6f9; min-height: 100vh; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Panggilan Fragment Sidebar (Passing parameter 'dashboard') -->
        <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 px-4 content pt-4">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                <h2><i class="fa-solid fa-chart-line text-primary"></i> Dashboard Sistem Klinik</h2>
            </div>

            <!-- Ringkasan Kartu Statistik -->
            <div class="row">
                <!-- Total Dokter -->
                <div class="col-md-3 mb-3">
                    <div class="card bg-primary text-white shadow-sm border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase small fw-bold">Total Dokter</h6>
                                <h2 class="fw-bold mb-0" th:text="${totalDokter != null ? totalDokter : 0}">0</h2>
                            </div>
                            <i class="fa-solid fa-user-md fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>

                <!-- Total Pasien -->
                <div class="col-md-3 mb-3">
                    <div class="card bg-success text-white shadow-sm border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase small fw-bold">Total Pasien</h6>
                                <h2 class="fw-bold mb-0" th:text="${totalPasien != null ? totalPasien : 0}">0</h2>
                            </div>
                            <i class="fa-solid fa-users fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>

                <!-- Antrean Hari Ini / Menunggu -->
                <div class="col-md-3 mb-3">
                    <div class="card bg-warning text-dark shadow-sm border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase small fw-bold">Antrean Menunggu</h6>
                                <h2 class="fw-bold mb-0" th:text="${antreanHariIni != null ? antreanHariIni : 0}">0</h2>
                            </div>
                            <i class="fa-solid fa-clipboard-list fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>

                <!-- Pemeriksaan Selesai -->
                <div class="col-md-3 mb-3">
                    <div class="card bg-info text-white shadow-sm border-0">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase small fw-bold">Pemeriksaan Selesai</h6>
                                <h2 class="fw-bold mb-0" th:text="${pemeriksaanSelesai != null ? pemeriksaanSelesai : 0}">0</h2>
                            </div>
                            <i class="fa-solid fa-stethoscope fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
